name: Release APK

# Builds an Android APK with EAS and attaches it to a GitHub Release so users can
# sideload it without the Play Store. There is no iOS equivalent: iOS cannot be
# sideloaded from a web link, and no distribution channel is set up for it.
#
# This is a reusable workflow rather than a `release: published` listener.
# release-please tags and publishes with the default GITHUB_TOKEN, and GitHub
# deliberately does not start new workflow runs from GITHUB_TOKEN events, so a
# `release: published` trigger here would never fire. release-please.yml calls
# this workflow directly instead, within its own run.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to attach the APK to'
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        # Optional so a fork without an Expo account still gets a green run:
        # the guard step below turns an absent token into a skip, not a failure.
        description: 'Expo access token used to run the EAS build'
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (e.g. israeli-bank-importer-app-v0.2.0)'
        required: true
        type: string

# Least privilege: the workflow token is read-only by default and only the build
# job opts in to the write it needs to attach the APK asset.
permissions:
  contents: read

# `gh release upload --clobber` deletes before it re-uploads, which can change
# asset order. Share this per-tag group with the SMS uploader so only one can
# mutate a release at a time; neither mutation is safe to cancel halfway.
concurrency:
  group: release-apk-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Runs first, holds no secret and checks out nothing: it decides which
  # commit the job below may build (see verify-release-tag.yml).
  verify:
    name: Verify release tag
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yml
    with:
      tag: ${{ inputs.tag }}

  build-apk:
    name: Build & attach Android APK
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # `gh release upload` attaches the APK to the release
    steps:
      - name: Gate on EXPO_TOKEN
        id: guard
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN secret not set - skipping APK build. Add it in repo settings to publish APKs to Releases."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The verified commit, not the tag name: a tag re-pointed after the
          # check cannot change what gets built.
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - if: steps.guard.outputs.run == 'true'
        uses: ./.github/actions/setup-node
      - if: steps.guard.outputs.run == 'true'
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - if: steps.guard.outputs.run == 'true'
        name: Point the build at this account's update server
        # `updates.url` is derived from the committed project id. It is
        # configured here rather than committed so the value cannot drift from
        # the id; without it the binary ships with no update endpoint and could
        # never pick up an over-the-air release. Idempotent.
        run: eas update:configure --platform android --non-interactive
      - if: steps.guard.outputs.run == 'true'
        name: Build Android APK (EAS cloud)
        id: build
        run: |
          URL=$(eas build --platform android --profile apk --non-interactive --wait --json \
            | jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl')
          case "$URL" in
            https://*) : ;;
            *) echo "::error::Unexpected APK artifact URL"; exit 1 ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.run == 'true'
        name: Download APK
        env:
          APK_URL: ${{ steps.build.outputs.url }}
        run: curl -fL -o israeli-bank-importer.apk "$APK_URL"
      - if: steps.guard.outputs.run == 'true'
        name: Attach APK to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" israeli-bank-importer.apk --clobber
      - if: steps.guard.outputs.run == 'true'
        name: Keep the standard APK first for older apps
        uses: ./.github/actions/guard-apk-order
        with:
          release_tag: ${{ inputs.tag }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
