version: 2
# Grouped weekly Dependabot updates for the Expo / React Native app. Related
# packages are batched into per-group PRs (bounded by open-pull-requests-limit)
# instead of many ungrouped PRs. Covers npm dependencies and the GitHub Actions
# used by the CI/security workflows.

updates:
  # ── npm ────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    labels: ['dependencies', 'npm']
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    # Upgrades that the registry offers but this app cannot take. Each entry
    # records what blocks it, so the list can be re-tested rather than
    # re-argued at the next Expo SDK upgrade. Every entry is scoped to the
    # incompatible upgrade path only, so patch releases - which is how these
    # projects ship security fixes - still reach the review queue.
    ignore:
      # Expo SDK 54 builds against react 19.1.0 and react-native 0.81.5.
      # Newer minor lines belong to a later SDK, and `npx expo install
      # --check` rejects them, so the React line moves when the SDK moves.
      - dependency-name: react
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: react-native
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: react-test-renderer
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # eslint-config-expo is published per SDK - its dist-tags are literally
      # sdk-51, canary-sdk-55, canary-sdk-56 - so 10.x is the SDK 54 line and
      # 'latest' tracks whichever SDK shipped most recently.
      - dependency-name: eslint-config-expo
        update-types: ['version-update:semver-major']
      # ESLint 10 removed context.getFilename(). Every published
      # eslint-config-expo, 57.0.1 included, still nests an
      # eslint-plugin-react that calls it, and the lint run dies on the first
      # file. Re-test when eslint-config-expo ships a react plugin built for
      # ESLint 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # unicorn 72 peers on eslint >=10.4, which the entry above blocks.
      - dependency-name: eslint-plugin-unicorn
        update-types: ['version-update:semver-major']
      # jest-expo 54 resolves jest 29 internals. jest-runtime 30 against
      # jest-mock 29 fails every suite with "clearMocksOnScope is not a
      # function", so jest moves when jest-expo moves.
      - dependency-name: jest
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
      # typescript-eslint peers on typescript >=4.8.4 <6.1.0 in every
      # published version, so TypeScript 7 would disable type-aware linting.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'jest-expo'
      react-navigation:
        patterns:
          - '@react-navigation/*'
          - 'react-native-screens'
          - 'react-native-safe-area-context'
          - 'react-native-gesture-handler'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-native'
          - 'react-test-renderer'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint*'
          - '@typescript-eslint/*'
      jest:
        patterns:
          - 'jest'
          - 'jest-*'
          - '@jest/*'
          - 'babel-jest'
      types:
        patterns:
          - '@types/*'

  # ── GitHub Actions ─────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 3
    labels: ['dependencies', 'github-actions']
    commit-message:
      prefix: 'chore(ci)'
      include: scope
    groups:
      actions-core:
        patterns:
          - 'actions/*'
      expo-actions:
        patterns:
          - 'expo/*'
      security-actions:
        patterns:
          - 'github/codeql-action*'
          - 'ossf/*'
          - 'gitleaks/*'
          - 'SonarSource/*'
          - 'lycheeverse/*'
