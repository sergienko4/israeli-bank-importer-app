name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Lint workflow action pins
        run: npm run lint:actions
      - name: Lint lockfile registry hosts
        run: npm run lint:lockfile
      - name: Contract matches the importer
        run: npm run contract:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test with coverage
        run: npm run test:coverage
      # Blocking, not advisory. Doctor is what catches a dependency drifting
      # off the Expo SDK line (a missing native peer, or a bump past the SDK
      # pin). While this ran with continue-on-error it stayed red on main
      # across several merges without turning a single check red.
      - name: Expo Doctor
        run: npx --yes expo-doctor@1.20.1
      - name: Bundle for iOS + Android
        run: npm run export
      - name: No bundled module shadows a global
        run: npm run check:bundle
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 5

  docs:
    name: Documentation Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint markdown
        # CHANGELOG.md is excluded because release-please emits it, and always
        # writes two blank lines before a section heading, which trips MD012.
        # It is regenerated on every release, so a manual fix would be
        # overwritten and the gate would fail again next time. Excluded here
        # rather than disabling MD012 in .markdownlint.jsonc, which would drop
        # the rule for the hand-written docs as well.
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: |
            **/*.md
            !node_modules
            !CHANGELOG.md
      - name: Check links
        # Offline on purpose: only links into the repository are verified here.
        # A relative link breaks because someone moved a file, which is exactly
        # what a pull request gate should catch. An external link breaks because
        # a third party had a bad minute - scorecard.dev refused the connection,
        # fast-check.dev timed out, actualbudget.org reset the connection - none
        # of which the pull request caused or can fix. Excluding hosts one at a
        # time was losing coverage with every incident, so the reachability
        # probe moved to link-check.yml, which runs weekly: link rot is a
        # function of time, not of the change under review.
        #
        # CHANGELOG.md is excluded because every entry release-please writes
        # points at a tag comparison URL, and the tag it names is only created
        # once the release pull request merges, so the link is guaranteed to be
        # missing while the gate is checking it. The value is a regular
        # expression matched against the path as lychee resolves it, which has
        # no leading "./" even when the input glob does. Writing
        # "./CHANGELOG.md" here silently matches nothing.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --exclude-path CHANGELOG.md "./**/*.md"
          fail: true

  licenses:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Check licenses (fail on AGPL)
        run: npm run lint:licenses

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check SonarCloud credentials
        id: guard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN not set - skipping SonarCloud. Add SONAR_TOKEN/SONAR_ORG/SONAR_PROJECT_KEY to enable it."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # `tsconfig.json` extends `expo/tsconfig.base`, which lives in
      # node_modules. Without an install the scanner cannot resolve it, falls
      # back to an empty TypeScript configuration, and analyses the app with no
      # type information - so its findings would not reflect the real code.
      - if: steps.guard.outputs.run == 'true'
        uses: ./.github/actions/setup-node
      - if: steps.guard.outputs.run == 'true'
        name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage
      - if: steps.guard.outputs.run == 'true'
        name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [build, docs, licenses, sonar]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ] \
            || [ "${{ needs.docs.result }}" != "success" ] \
            || [ "${{ needs.licenses.result }}" != "success" ] \
            || [ "${{ needs.sonar.result }}" != "success" ]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
