name: Release OTA update

# Publishes the JavaScript bundle of a release to the EAS `production` channel,
# so installed apps pick it up on their next launch instead of waiting for the
# user to notice a new APK on the Releases page. A second leg publishes the
# same commit, built with OTP_SMS_AUTOREAD=1, to `production-sms` for the SMS
# APK that release-apk-sms.yml attaches.
#
# This runs unconditionally on every release. `runtimeVersion` uses the
# `fingerprint` policy, which means the runtime id only moves when native code
# moves: if a release changed native code the update is published under a new
# runtime that no installed binary matches, so it is simply never delivered and
# the APK attached to the same release is the upgrade path instead. That makes
# an unconditional publish safe and removes the need to diff fingerprints here.
#
# Reusable rather than a `release: published` listener for the same reason as
# release-apk.yml: releases created with GITHUB_TOKEN do not start new runs.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag the update belongs to'
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        # Optional so a fork without an Expo account still gets a green run.
        description: 'Expo access token used to publish the update'
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (e.g. israeli-bank-importer-app-v0.3.0)'
        required: true
        type: string

permissions:
  contents: read

# A release-triggered run and a manual re-run of the same tag would otherwise
# race and publish the same bundle twice. Queue instead of cancelling: a publish
# that is already talking to EAS should be allowed to finish.
concurrency:
  group: release-ota-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Runs first, holds no secret and checks out nothing: it decides which
  # commit the job below may build (see verify-release-tag.yml).
  verify:
    name: Verify release tag
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release-tag.yml
    with:
      tag: ${{ inputs.tag }}

  publish-ota:
    name: Publish over-the-air update (${{ matrix.channel }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      # Each leg feeds its own channel, so one failing must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - channel: production
            platform: all
            autoread: ''
          # The SMS APK (release-apk-sms.yml) is Android-only and listens on
          # its own channel; its runtime is the fingerprint of the config with
          # OTP_SMS_AUTOREAD=1, so only an update built the same way matches.
          - channel: production-sms
            platform: android
            autoread: '1'
    steps:
      - name: Gate on EXPO_TOKEN
        id: guard
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN secret not set - skipping the update. Add it in repo settings to publish over-the-air updates."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The verified commit, not the tag name: a tag re-pointed after the
          # check cannot change what gets built.
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - if: steps.guard.outputs.run == 'true'
        uses: ./.github/actions/setup-node
      - if: steps.guard.outputs.run == 'true'
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: latest
      - if: steps.guard.outputs.run == 'true'
        name: Point the bundle at this account's update server
        # `updates.url` is derived from the committed project id rather than
        # committed itself, so the two cannot drift apart. Idempotent. Run
        # without the SMS flag on both legs: this writes the resolved
        # `updates` into app.json, and the flag's channel header must not
        # land there.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update:configure --platform android --non-interactive
      - if: steps.guard.outputs.run == 'true'
        name: Publish to the ${{ matrix.channel }} channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          CHANNEL: ${{ matrix.channel }}
          PLATFORM: ${{ matrix.platform }}
          # Empty on the production leg, which app.config.ts treats as unset.
          OTP_SMS_AUTOREAD: ${{ matrix.autoread }}
        run: |
          eas update --channel "$CHANNEL" --platform "$PLATFORM" --message "$RELEASE_TAG" \
            --environment production --non-interactive
