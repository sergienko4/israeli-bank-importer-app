name: Release store build

# Queues the store-track build - an Android App Bundle, plus iOS once Apple
# credentials are on the EAS account - so every release shows its store build
# beside the APK and the over-the-air update in a single run.
#
# Reusable rather than a `release: published` listener for the same reason as
# release-apk.yml: release-please tags with the default GITHUB_TOKEN, and GitHub
# never starts a new workflow run from a GITHUB_TOKEN event.
#
# The build is queued, not awaited. Nothing downstream needs the binary - store
# artifacts are collected from EAS and submitted from there - so waiting would
# only hold a runner open for the length of the EAS queue.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag the build belongs to'
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        # Optional so a fork without an Expo account still gets a green run:
        # the guard step below turns an absent token into a skip, not a failure.
        description: 'Expo access token used to run the EAS build'
        required: false
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platforms to build'
        required: false
        type: choice
        default: android
        options:
          - android
          - ios
          - all

permissions:
  contents: read

# A release-triggered run and a manual run of the same tag would otherwise queue
# the same build twice. Queue instead of cancelling: a run that is already
# registering a build with EAS should be allowed to finish.
concurrency:
  group: release-store-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  store-build:
    name: Queue store build
    runs-on: ubuntu-latest
    steps:
      - name: Gate on EXPO_TOKEN
        id: guard
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN secret not set - skipping the store build. Add it in repo settings to queue store builds."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.guard.outputs.run == 'true'
        uses: ./.github/actions/setup-node
      - if: steps.guard.outputs.run == 'true'
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - if: steps.guard.outputs.run == 'true'
        name: Link the EAS project
        # app.json carries no `extra.eas.projectId` on purpose, so the id is
        # resolved from `owner` + `slug` at build time instead of pinning the
        # repo to one Expo account. Idempotent - same call as release-apk.yml.
        run: eas init --non-interactive --force
      - if: steps.guard.outputs.run == 'true'
        name: Point the build at this account's update server
        # Without this the store binary ships with no update endpoint and could
        # never pick up an over-the-air release, which is the whole point of
        # publishing one. Both platforms, because either may be built below.
        run: eas update:configure --platform all --non-interactive
      - if: steps.guard.outputs.run == 'true'
        name: Queue the build
        env:
          # Android alone by default. An iOS store build needs Apple Developer
          # credentials on the EAS account, and a release must not turn red
          # because they are absent. Set the STORE_BUILD_PLATFORM repository
          # variable to `all` once they are in place; a manual run from the
          # Actions tab overrides it either way.
          PLATFORM: ${{ inputs.platform || vars.STORE_BUILD_PLATFORM || 'android' }}
        run: eas build --platform "$PLATFORM" --profile production --non-interactive --no-wait
