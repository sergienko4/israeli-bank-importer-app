name: release-please

# Maintains a version + CHANGELOG PR from Conventional Commits. Merging that PR
# tags a GitHub release (v<version>), which the EAS Build workflow reacts to.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
