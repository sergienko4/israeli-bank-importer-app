name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # A merge that Dependabot auto-merge performs is pushed with GITHUB_TOKEN,
  # which starts no workflow run, so `push` above misses it. Run this by hand
  # to test main after such merges.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Lint workflow action pins
        run: npm run lint:actions
      - name: Lint lockfile registry hosts
        run: npm run lint:lockfile
      - name: Contract matches the importer
        run: npm run contract:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # The script pre-push runs, so CI checks the markdownlint-cli2 that
      # package-lock.json resolves and a Dependabot bump of it is linted before
      # it merges. The script excludes CHANGELOG.md because release-please
      # emits it, and always writes two blank lines before a section heading,
      # which trips MD012. It is regenerated on every release, so a manual fix
      # would be overwritten and the gate would fail again next time. Excluded
      # there rather than disabling MD012 in .markdownlint.jsonc, which would
      # drop the rule for the hand-written docs as well.
      - name: Lint markdown
        run: npm run lint:md
      - name: Format check
        run: npm run format:check
      - name: Test with coverage
        run: npm run test:coverage
      # Blocking, not advisory. Doctor is what catches a dependency drifting
      # off the Expo SDK line (a missing native peer, or a bump past the SDK
      # pin). While this ran with continue-on-error it stayed red on main
      # across several merges without turning a single check red.
      #
      # EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK skips the one doctor check
      # whose reference moves under every pull request. That check fetches the
      # expected versions for the SDK line live from api.expo.dev, which
      # advances every time Expo publishes a patch (every few days), so any
      # branch resolved from an older snapshot - a weekly Dependabot PR by
      # definition - fails no matter how consistent it is. The check below
      # replaces it with the installed expo's bundledNativeModules.json as the
      # stable reference.
      - name: Expo Doctor
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: true
        run: npx --yes expo-doctor@1.20.1
      # Validates the declared versions against bundledNativeModules.json of
      # the installed expo package, with EXPO_OFFLINE forcing the pure-local
      # reference that expo install --check otherwise replaces with the same
      # live api.expo.dev data. That reference is stable: a bump that keeps
      # the expo group internally consistent with the expo it installs passes
      # regardless of what Expo published afterwards, while a missing native
      # peer or a bump past the pin still fails. expo install --fix at bump
      # time still resolves against the live API.
      - name: Versions match the installed Expo SDK
        run: EXPO_OFFLINE=1 npx expo install --check
      - name: Bundle for iOS + Android
        run: npm run export
      - name: No bundled module shadows a global
        run: npm run check:bundle
      # The SMS auto-read wiring lives in app.config.ts, which no test can
      # import, so this is the only gate that sees whether the permission and
      # the receiver actually reach the manifest. The feature shipped once
      # without them and every other check was green.
      - name: Manifest wires up SMS auto-read
        run: npm run check:manifest
      # The release workflows name the APK assets and update channels the app
      # expects, and build only the commit a verified tag points at. A
      # mismatch still builds and publishes; the release is just wrong.
      - name: Release workflows match the app
        run: npm run check:release
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 5

  # The `build` job already validates the Expo pin table, but every one of its
  # steps runs after `npm ci`, and pin drift is precisely what stops `npm ci`
  # from resolving. When the SDK moves a native pin that dependabot.yml holds
  # frozen - expo 57.0.17 moved react-native to 0.86.3 while react-native was
  # ignored - the two peer ranges become unsatisfiable and the install aborts,
  # so the check that would have named the culprit never runs. What the reader
  # gets instead is an ERESOLVE about @react-native/jest-preset, a package
  # nobody declared (PR #106).
  #
  # This job exists to make that diagnosis reachable. It installs with
  # --legacy-peer-deps so an unsatisfiable peer cannot silence the check, and
  # with --ignore-scripts because reading declared versions needs no
  # lifecycle scripts (the full scripted install still happens in `build`). It
  # deliberately does not use ./.github/actions/setup-node, whose lockfile-exact
  # `npm ci` is the very step that dies.
  expo-pins:
    name: Expo SDK pin drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the npm registry for this job
        run: echo 'NPM_CONFIG_REGISTRY=https://registry.npmjs.org/' >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Matches the `engines.node` floor declared in package.json.
          node-version: '22'
          cache: npm
      - name: Install tolerating peer conflicts
        run: npm ci --legacy-peer-deps --ignore-scripts
      # --no-install because the tolerant install above already placed the exact
      # expo this lockfile resolves; letting npx fetch its own would validate a
      # different SDK than the one the app builds against.
      - name: Versions match the installed Expo SDK
        run: EXPO_OFFLINE=1 npx --no-install expo install --check

  docs:
    name: Documentation Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Markdown lint runs in `build`, which already installs the lockfile's
      # markdownlint-cli2; this job needs no install.
      - name: Check links
        # Offline on purpose: only links into the repository are verified here.
        # A relative link breaks because someone moved a file, which is exactly
        # what a pull request gate should catch. An external link breaks because
        # a third party had a bad minute - scorecard.dev refused the connection,
        # fast-check.dev timed out, actualbudget.org reset the connection - none
        # of which the pull request caused or can fix. Excluding hosts one at a
        # time was losing coverage with every incident, so the reachability
        # probe moved to link-check.yml, which runs weekly: link rot is a
        # function of time, not of the change under review.
        #
        # CHANGELOG.md is excluded because every entry release-please writes
        # points at a tag comparison URL, and the tag it names is only created
        # once the release pull request merges, so the link is guaranteed to be
        # missing while the gate is checking it. The value is a regular
        # expression matched against the path as lychee resolves it, which has
        # no leading "./" even when the input glob does. Writing
        # "./CHANGELOG.md" here silently matches nothing.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --exclude-path CHANGELOG.md "./**/*.md"
          fail: true

  licenses:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Check licenses (fail on AGPL)
        run: npm run lint:licenses

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check SonarCloud credentials
        id: guard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN not set - skipping SonarCloud. Add SONAR_TOKEN/SONAR_ORG/SONAR_PROJECT_KEY to enable it."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # `tsconfig.json` extends `expo/tsconfig.base`, which lives in
      # node_modules. Without an install the scanner cannot resolve it, falls
      # back to an empty TypeScript configuration, and analyses the app with no
      # type information - so its findings would not reflect the real code.
      - if: steps.guard.outputs.run == 'true'
        uses: ./.github/actions/setup-node
      - if: steps.guard.outputs.run == 'true'
        name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - if: steps.guard.outputs.run == 'true'
        name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

  # Dependabot pull requests merge on green CI alone (dependabot-auto-merge.yml),
  # and auto-merge stays enabled when someone else pushes to the branch. The
  # workflow that switches it off runs only after that push, so a human edit
  # could pass the other checks and merge first. This job closes that window at
  # the merge gate: CI Pass is required, and required checks are judged per head
  # commit, so a branch holding any commit not made by Dependabot itself or by
  # the "Update branch" button cannot merge without a human.
  #
  # Both kinds of allowed commit are committed by GitHub. A Dependabot commit
  # has one parent and Dependabot as author. An "Update branch" merge has the
  # clicking user as author, so it is accepted only when its content is exactly
  # what git produces by merging the base branch in with no conflicts: a merge
  # resolved by hand in the conflict editor, or edited after the fact, fails.
  #
  # The guard is against an accidental human edit merging unreviewed, not a
  # malicious writer, who can already merge their own pull request because no
  # review is required. Author and committer emails are not verified here.
  dependabot-gate:
    name: Dependabot provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether this is a Dependabot pull request
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not a Dependabot pull request - nothing to check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # fetch-depth 0 fetches every branch into origin/*, which provides the
      # base branch the commits are measured against.
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - if: steps.guard.outputs.run == 'true'
        name: Every commit comes from Dependabot or "Update branch"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # The current tip rather than the event's base SHA, so a base commit
          # brought in by "Update branch" is never counted as a branch commit.
          base="refs/remotes/origin/$BASE_REF"
          if ! git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            echo "::error::$base is missing from the checkout, so the commits on this pull request cannot be listed."
            exit 1
          fi
          dependabot='49699333+dependabot[bot]@users.noreply.github.com'
          commits="$(git rev-list --parents "$base..$HEAD_SHA")"
          bad=0
          while read -r c p1 p2 extra; do
            [ -n "$c" ] || continue
            author="$(git show -s --format=%ae "$c")"
            committer="$(git show -s --format=%ce "$c")"
            subject="$(git show -s --format=%s "$c")"
            reason=""
            if [ "$committer" != "noreply@github.com" ]; then
              reason="committed outside GitHub"
            elif [ -z "$p1" ] || [ -n "$extra" ]; then
              reason="neither a single-parent commit nor a two-parent merge"
            elif [ -z "$p2" ]; then
              [ "$author" = "$dependabot" ] || reason="not authored by Dependabot"
            elif [[ "$subject" != "Merge branch '$BASE_REF' into "* ]]; then
              reason="not an \"Update branch\" merge"
            elif ! git merge-base --is-ancestor "$p2" "$base"; then
              reason="merges a commit that is not on $BASE_REF"
            elif ! tree="$(git merge-tree --write-tree "$p1" "$p2")"; then
              reason="the merge had conflicts that were resolved by hand"
            elif [ "${tree%%$'\n'*}" != "$(git rev-parse "$c^{tree}")" ]; then
              reason="the merge result differs from a clean merge"
            fi
            if [ -n "$reason" ]; then
              echo "::error::$c: $reason (author $author, committer $committer, subject \"$subject\")"
              bad=1
            else
              echo "ok $c $subject"
            fi
          done <<< "$commits"
          if [ "$bad" -ne 0 ]; then
            echo "::error::This Dependabot pull request holds commits that neither Dependabot nor a clean \"Update branch\" merge made, so it cannot merge on green CI. Comment \"@dependabot recreate\" to drop them, or have an admin merge it after review."
            exit 1
          fi
          echo "Every commit came from Dependabot or a clean \"Update branch\" merge."

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [build, expo-pins, docs, licenses, sonar, dependabot-gate]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ] \
            || [ "${{ needs['expo-pins'].result }}" != "success" ] \
            || [ "${{ needs.docs.result }}" != "success" ] \
            || [ "${{ needs.licenses.result }}" != "success" ] \
            || [ "${{ needs.sonar.result }}" != "success" ] \
            || [ "${{ needs['dependabot-gate'].result }}" != "success" ]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
