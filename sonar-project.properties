# SonarCloud configuration.
# Organization, project key, and token are injected via GitHub Secrets
# (SONAR_ORG, SONAR_PROJECT_KEY, SONAR_TOKEN). The SonarCloud CI job self-skips
# when SONAR_TOKEN is absent, so CI stays green until it is configured.

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.sourceEncoding=UTF-8

# TypeScript coverage (lcov produced by `npm run test:coverage`).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=node_modules/**,dist/**,coverage/**,assets/**,babel.config.js,metro.config.js
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/index.ts,src/components/ui/**,src/screens/**,src/theme/**,App.tsx

# SonarCloud analyzes every PR and BLOCKS CI on the Quality Gate result:
# with sonar.qualitygate.wait=true the "SonarCloud Analysis" job fails when the
# gate fails, so the CI pass/fail reflects the gate. Coverage-heavy conditions are
# scoped by sonar.coverage.exclusions above (presentational UI is excluded). If the
# default "Sonar way" gate proves too strict, tune it in SonarCloud project settings.
sonar.qualitygate.wait=true
