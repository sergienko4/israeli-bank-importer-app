# SonarCloud configuration.
# Organization, project key, and token are injected via GitHub Secrets
# (SONAR_ORG, SONAR_PROJECT_KEY, SONAR_TOKEN). The SonarCloud CI job self-skips
# when SONAR_TOKEN is absent, so CI stays green until it is configured.

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.sourceEncoding=UTF-8

# TypeScript coverage (lcov produced by `npm run test:coverage`).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=node_modules/**,dist/**,coverage/**,assets/**,babel.config.js,metro.config.js
# Coverage exclusions: unit tests, barrels, and thin glue over native/animation
# APIs (RN Animated/AccessibilityInfo hooks, haptics/layout wrappers, Expo push,
# Context providers, and presentational UI). Pure logic (otp, config, api client,
# homeOverview, timeouts, connection store) stays in scope so the gate reflects
# real business-logic coverage. Type-only modules have no lines to cover.
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/index.ts,src/components/**,src/screens/**,src/theme/**,App.tsx,src/lib/useReducedMotion.ts,src/lib/useMountPop.ts,src/lib/usePressScale.ts,src/lib/useOtpCapture.ts,src/lib/haptics.ts,src/lib/layoutAnimation.ts,src/push/**,src/auth/AuthContext.tsx

# SonarCloud analyzes every PR and BLOCKS CI on the Quality Gate result:
# with sonar.qualitygate.wait=true the "SonarCloud Analysis" job fails when the
# gate fails, so the CI pass/fail reflects the gate. Coverage-heavy conditions are
# scoped by sonar.coverage.exclusions above (presentational UI is excluded). If the
# default "Sonar way" gate proves too strict, tune it in SonarCloud project settings.
sonar.qualitygate.wait=true
