name: Setup feature deps (one-shot)

# One-shot, self-deleting. Adds expo-secure-store + the jest-expo test toolchain
# at SDK-correct versions and syncs the lockfile on clean CI npm (npm is blocked
# in the authoring environment). Commits back to this branch, then removes itself.

on:
  push:
    branches: [feat/connect-login]
    paths: ['.github/workflows/setup-test-deps.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install current dependencies
        run: npm install
      - name: Add expo-secure-store (runtime)
        run: npx --yes expo install expo-secure-store
      - name: Add jest-expo test toolchain (dev)
        run: |
          npm install --save-dev react-test-renderer@19.2.3
          npx --yes expo install --dev jest-expo jest @types/jest
      - name: Commit synced manifests and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --quiet .github/workflows/setup-test-deps.yml
          git add package.json package-lock.json
          git commit -m 'chore: add expo-secure-store + jest-expo toolchain'
          git push origin HEAD:feat/connect-login
