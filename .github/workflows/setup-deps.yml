name: Setup dev dependencies (one-shot)

# One-shot, self-deleting. Adds the ESLint toolchain at Expo-SDK-correct versions
# (resolved by `expo install`) and syncs package-lock.json on clean CI npm, since
# npm is unavailable in the authoring environment. Removes itself when done.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/setup-deps.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install current dependencies
        run: npm install
      - name: Add ESLint toolchain (Expo-resolved versions)
        run: npx --yes expo install --dev eslint eslint-config-expo
      - name: Verify lint config resolves
        run: npx eslint . --max-warnings 0
      - name: Commit synced manifests and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --quiet .github/workflows/setup-deps.yml
          git add package.json package-lock.json
          git commit -m 'chore: add eslint toolchain (expo-resolved)'
          git push origin HEAD:main
