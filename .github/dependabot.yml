version: 2
# Grouped weekly Dependabot updates for the Expo / React Native app. Related
# packages are batched into per-group PRs (bounded by open-pull-requests-limit)
# instead of many ungrouped PRs. Covers npm dependencies and the GitHub Actions
# used by the CI/security workflows.

updates:
  # ── npm ────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    labels: ['dependencies', 'npm']
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    # Upgrades that the registry offers but this app cannot take. Each entry
    # records what blocks it, so the list can be re-tested rather than
    # re-argued at the next Expo SDK upgrade. Every entry is scoped by
    # `update-types` rather than naming a bare dependency, so it filters
    # version updates only - security updates are not a `version-update:*`
    # type and still reach the review queue.
    #
    # The Expo block below is not a list of opinions: it is every declared
    # package that appears in `expo/bundledNativeModules.json`, which is the
    # file `npx expo install --check` validates against. A bump past the SDK
    # pin turns `expo doctor` red, and doctor is a required CI check, so each
    # entry is scoped to the pin's *shape*:
    #   exact pin (`19.2.3`)  -> any bump breaks it, so ignore all three
    #   tilde pin (`~5.7.0`)  -> patch stays inside the range, ignore the rest
    # These move when the SDK moves - bump `expo`, then `npx expo install
    # --fix`, which is why `expo` itself is deliberately NOT ignored.
    ignore:
      # Exact pins. Expo SDK 57 pins each native module to a single version, so
      # a bump Dependabot resolves on its own fails `npx expo install --check`.
      # A react patch slipping through this gap is what broke doctor on main
      # (PRs #67/#68).
      #
      # Deliberately no version numbers here: they go stale. The SDK moves its
      # own pins *within* a line - expo 57.0.17 moved react-native from 0.86.2
      # to 0.86.3 - and Dependabot cannot follow, because it resolves to
      # registry-latest (react-native@latest is already 0.87.x, well past SDK
      # 57) rather than to whatever the installed expo pins. So these stay
      # ignored and `npx expo install --fix` owns the versions. The `expo-pins`
      # job in ci.yml is what reports that the fix is overdue: PR #106 bumped
      # the expo group, jest-expo took its patch and followed the SDK,
      # react-native could not, and npm ci was left unable to resolve.
      - dependency-name: react
        update-types:
          [
            'version-update:semver-patch',
            'version-update:semver-minor',
            'version-update:semver-major',
          ]
      - dependency-name: react-native
        update-types:
          [
            'version-update:semver-patch',
            'version-update:semver-minor',
            'version-update:semver-major',
          ]
      - dependency-name: react-native-reanimated
        update-types:
          [
            'version-update:semver-patch',
            'version-update:semver-minor',
            'version-update:semver-major',
          ]
      - dependency-name: react-native-worklets
        update-types:
          [
            'version-update:semver-patch',
            'version-update:semver-minor',
            'version-update:semver-major',
          ]
      - dependency-name: react-native-keyboard-controller
        update-types:
          [
            'version-update:semver-patch',
            'version-update:semver-minor',
            'version-update:semver-major',
          ]
      # Tilde pins. A patch resolves inside the SDK's own range and stays
      # compatible; a minor leaves it. safe-area-context reaching 5.8.0 past
      # the SDK's `~5.7.0` is the other half of the doctor breakage.
      - dependency-name: react-native-safe-area-context
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: jest-expo
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # eslint-config-expo is published per SDK - its dist-tags are literally
      # sdk-51, canary-sdk-55, canary-sdk-56 - so 57.x is the SDK 57 line and
      # 'latest' tracks whichever SDK shipped most recently. It is also
      # bundledNativeModules-pinned at `~57.0.1`, hence the minor entry.
      - dependency-name: eslint-config-expo
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # Not SDK-pinned, but @types/react tracks whichever react line the SDK
      # ships, so it moves with the entry above rather than independently.
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # ESLint 10 removed context.getFilename(). Every published
      # eslint-config-expo, 57.0.1 included, still nests an
      # eslint-plugin-react that calls it, and the lint run dies on the first
      # file. Re-test when eslint-config-expo ships a react plugin built for
      # ESLint 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # unicorn 72 peers on eslint >=10.4, which the entry above blocks.
      - dependency-name: eslint-plugin-unicorn
        update-types: ['version-update:semver-major']
      # jest-expo 54 resolves jest 29 internals. jest-runtime 30 against
      # jest-mock 29 fails every suite with "clearMocksOnScope is not a
      # function", so jest moves when jest-expo moves.
      - dependency-name: jest
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
      # typescript-eslint peers on typescript >=4.8.4 <6.1.0 in every
      # published version, so TypeScript 7 would disable type-aware linting.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'jest-expo'
      react-navigation:
        patterns:
          - '@react-navigation/*'
          - 'react-native-screens'
          - 'react-native-safe-area-context'
          - 'react-native-gesture-handler'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-native'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint*'
          - '@typescript-eslint/*'
      jest:
        patterns:
          - 'jest'
          - 'jest-*'
          - '@jest/*'
          - 'babel-jest'
      types:
        patterns:
          - '@types/*'

  # ── GitHub Actions ─────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 3
    labels: ['dependencies', 'github-actions']
    commit-message:
      prefix: 'chore(ci)'
      include: scope
    groups:
      actions-core:
        patterns:
          - 'actions/*'
      expo-actions:
        patterns:
          - 'expo/*'
      security-actions:
        patterns:
          - 'github/codeql-action*'
          - 'ossf/*'
          - 'gitleaks/*'
          - 'SonarSource/*'
          - 'lycheeverse/*'
