# Builds a development client on demand, so a contributor can get an installable
# build without a local Android toolchain.
#
# Manual trigger only: a development build is wanted occasionally, not on every
# push, and each one costs EAS build minutes.
#
# Android only. No Apple credentials are configured for this project yet, so an
# iOS job would fail at the credentials step.
name: Development builds

on:
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build Android development client
    type: build
    environment: development
    params:
      platform: android
      profile: development
