# SonarCloud configuration.
# Organization, project key, and token are injected via GitHub Secrets
# (SONAR_ORG, SONAR_PROJECT_KEY, SONAR_TOKEN). The SonarCloud CI job self-skips
# when SONAR_TOKEN is absent, so CI stays green until it is configured.

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.sourceEncoding=UTF-8

# TypeScript coverage (lcov produced by `npm run test:coverage`).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=node_modules/**,dist/**,coverage/**,assets/**,babel.config.js,metro.config.js
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,App.tsx,src/**/index.ts

# Wait for the SonarCloud quality gate result.
sonar.qualitygate.wait=true
