name: Setup Node and install dependencies
description: >
  Single source of truth for how every workflow prepares a Node environment:
  the npm registry, the Node runtime version, and a lockfile-exact install.

runs:
  using: composite
  steps:
    # package-lock.json resolves every tarball against the public registry, and
    # scripts/lint-lockfile.mjs enforces it. A corporate mirror that lags the
    # public registry therefore cannot satisfy the lockfile - it reports the
    # newest package versions as unpublished. The committed .npmrc points the
    # install at the registry the lockfile was built from; this exports the same
    # value to $GITHUB_ENV so later steps, `npx`, and `eas` see it too.
    - name: Pin the npm registry for this job
      shell: bash
      run: echo 'NPM_CONFIG_REGISTRY=https://registry.npmjs.org/' >> "$GITHUB_ENV"

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # Matches the `engines.node` floor declared in package.json.
        node-version: '22'
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci
